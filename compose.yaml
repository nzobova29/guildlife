services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: guildlife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guildlife}
      POSTGRES_DB: guildlife
    volumes:
      - guildlife_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guildlife -d guildlife]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://guildlife:${POSTGRES_PASSWORD:-guildlife}@db:5432/guildlife
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_ACCESS_TOKEN: ${GIGACHAT_ACCESS_TOKEN:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://api.giga.chat/v1}
      GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      AI_DAILY_CALL_BUDGET: ${AI_DAILY_CALL_BUDGET:-0}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
volumes:
  guildlife_pg:
